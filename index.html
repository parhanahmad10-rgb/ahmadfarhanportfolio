<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1269cc">
<title>Portfolio Ahmad Farhan</title>
<style>
  :root{
    --sky:#6d9ac7;
    --blue:#1269cc;
    --cyan:#51eefc;
    --white:#ffffff;
    --ink:#303030;
    --ticker-h:36px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--ink);overflow:hidden}
  body{font-family:"Segoe UI",system-ui,sans-serif;color:var(--white)}

  /* ===== Sticky ticker (berjalan terus seperti running text berita) ===== */
  .ticker{
    position:fixed;top:0;left:0;right:0;height:var(--ticker-h);z-index:50;
    background:var(--blue);color:var(--white);
    border-bottom:2px solid var(--cyan);
    overflow:hidden;display:flex;align-items:center;
  }
  .ticker-track{
    display:flex;flex-shrink:0;white-space:nowrap;
    animation:run 25s linear infinite;
  }
  .ticker-track span{
    font-weight:800;font-size:14px;letter-spacing:.18em;padding:0 28px;
  }
  .ticker-track span::after{content:"\25C6";color:var(--cyan);margin-left:56px}
  @keyframes run{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @media (prefers-reduced-motion:reduce){.ticker-track{animation-duration:80s}}

  /* ===== Horizontal scroller ===== */
  .scroller{
    position:fixed;top:var(--ticker-h);left:0;right:0;bottom:0;
    display:flex;gap:0;
    overflow-x:auto;overflow-y:hidden;
    scroll-snap-type:x mandatory;scroll-behavior:smooth;
    scrollbar-width:none;
  }
  .scroller::-webkit-scrollbar{display:none}

  /* 1 slide = rasio 1080 x 1920, tinggi menyesuaikan layar */
  .slide{
    flex:0 0 auto;
    height:100%;
    aspect-ratio:1920 / 1080;
    scroll-snap-align:center;
    position:relative;overflow:hidden;
    background:var(--ink);
    container-type:inline-size;   /* agar font bisa skala mengikuti lebar slide */
  }
  .slide img.page{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

  /* ===== Placeholder konten (hapus kalau pakai gambar) ===== */
  .ph{
    position:absolute;inset:0;padding:8cqw;
    display:flex;flex-direction:column;justify-content:flex-end;gap:2cqw;
    background:linear-gradient(160deg,var(--ink) 55%,var(--blue));
  }
  .ph .no{font-size:30cqw;font-weight:900;line-height:.8;color:var(--cyan)}
  .ph h2{font-size:7cqw;font-weight:800}
  .ph p{font-size:3cqw;color:var(--sky)}

  /* ===== Navigasi kecil ===== */
  .hud{
    position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:40;
    display:flex;align-items:center;gap:10px;
    background:rgba(48,48,48,.85);border:1px solid var(--sky);
    padding:6px 12px;border-radius:999px;font-size:13px;
  }
  .hud button{
    background:none;border:0;color:var(--cyan);font-size:18px;cursor:pointer;padding:0 6px;
  }
  .hud button:focus-visible{outline:2px solid var(--cyan)}
  .bar{position:fixed;left:0;bottom:0;height:4px;background:var(--cyan);width:0;z-index:41}

  /* ===== Layar START ala game ===== */
  .start{
    position:fixed;inset:0;z-index:100;overflow:hidden;
    background:var(--ink) url("bg/start2.gif") center / cover no-repeat;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    cursor:pointer;transition:opacity .7s ease, transform .7s ease;
  }
  .start.out{opacity:0;transform:scale(1.08);pointer-events:none}
  .start::before{ /* pita biru diagonal */
    content:"";position:absolute;left:-10%;right:-10%;top:30%;height:42%;
    background:var(--blue);transform:skewY(-8deg);
    border-top:6px solid var(--cyan);border-bottom:6px solid var(--sky);
    animation:band 1s cubic-bezier(.2,.8,.2,1) both;
  }
  .start::after{ /* garis cyan tipis */
    content:"";position:absolute;left:-10%;right:-10%;top:76%;height:10px;
    background:var(--cyan);transform:skewY(-8deg);opacity:.9;
    animation:band 1.3s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes band{from{transform:translateX(-100%) skewY(-8deg)}to{transform:translateX(0) skewY(-8deg)}}
  .start .t1,.start .t2,.start .press{position:relative;z-index:2;text-align:center}
  .start .t1{
    font-size:clamp(44px,11vw,140px);font-weight:900;font-style:italic;
    letter-spacing:.04em;line-height:1;color:var(--white);
    text-shadow:6px 6px 0 var(--ink);transform:skewY(-8deg) translateY(-6px);
  }
  .start .t2{
    margin-top:14px;font-size:clamp(20px,4.4vw,56px);font-weight:800;font-style:italic;
    letter-spacing:.3em;color:var(--white);text-shadow:3px 3px 0 var(--ink);
    transform:skewY(-8deg) translateY(-6px);
  }
  .start .press{
    position:absolute;bottom:9%;left:0;right:0;
    font-size:clamp(14px,2vw,22px);font-weight:700;letter-spacing:.35em;color:var(--white);
    animation:blink 1.1s steps(2,jump-none) infinite;
  }
  .start .press small{display:block;margin-top:8px;font-size:.62em;letter-spacing:.15em;color:var(--sky);font-weight:500}
  @keyframes blink{0%{opacity:1}50%{opacity:.15}100%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.start::before,.start::after{animation:none}.start .press{animation:none}}

  /* tombol musik */
  .hud .mus{border-left:1px solid var(--sky);padding-left:10px;font-size:13px;color:var(--cyan);display:flex;align-items:center;gap:6px}
  .hud .mus.off{color:var(--sky)}

  /* ===== MOBILE & SAFE AREA ===== */
  :root{--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
  html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
  .ticker{height:calc(var(--ticker-h) + var(--safe-t));padding-top:var(--safe-t)}
  .scroller{
    top:calc(var(--ticker-h) + var(--safe-t));
    overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;
  }
  .slide{scroll-snap-stop:always}
  .hud{bottom:calc(14px + var(--safe-b))}
  .hud button{min-width:40px;min-height:40px}
  .bar{bottom:var(--safe-b)}

  /* HP posisi berdiri: slide landscape dimuat penuh selebar layar, di tengah */
  @media (max-width:820px) and (orientation:portrait){
    :root{--ticker-h:30px}
    .scroller{align-items:center}
    .slide{height:auto;width:100vw}
    .ticker-track span{font-size:12px;padding:0 18px}
    .ticker-track span::after{margin-left:36px}
    .hud{gap:4px;padding:4px 8px}
    .start .t2{letter-spacing:.2em}
    .start .press{letter-spacing:.2em;padding:0 16px}
    .start .press small{letter-spacing:.08em}
  }
  /* HP posisi tidur: layar pendek, kecilkan ticker & HUD */
  @media (max-height:480px) and (orientation:landscape){
    :root{--ticker-h:26px}
    .ticker-track span{font-size:11px}
    .hud{bottom:calc(6px + var(--safe-b));padding:2px 8px}
    .hud button{min-height:32px}
    .start .t1{font-size:clamp(36px,9vh,80px)}
    .start .press{bottom:5%}
  }
</style>
</head>
<body>
<!-- Layar START -->
<div class="start" id="start" role="button" tabindex="0" aria-label="Mulai">
  <div class="t1">PORTFOLIO</div>
  <div class="t2">AHMAD FARHAN</div>
  <div class="press">PRESS ANY KEY TO START<small>klik, tap, atau tekan tombol apa saja &middot; nyalakan suara</small></div>
</div>
<audio id="bgm" src="music/bgm.mp3" loop preload="auto"></audio>


<!-- Sticky ticker: isi diduplikasi supaya loop mulus -->
<header class="ticker" aria-label="Portfolio Ahmad Farhan">
  <div class="ticker-track" id="track"></div>
</header>

<main class="scroller" id="scroller">
</main>

<nav class="hud" aria-label="Navigasi slide">
  <button id="prev" aria-label="Slide sebelumnya">&#9664;</button>
  <span id="count">1 / 14</span>
  <button id="next" aria-label="Slide berikutnya">&#9654;</button>
  <button id="mus" class="mus" aria-label="Nyalakan atau matikan musik" aria-pressed="true">&#9835; <span id="mtxt">ON</span></button>
</nav>
<div class="bar" id="bar"></div>

<script>
  // ===== PENGATURAN =====
  const TOTAL  = 14;
  const FOLDER = 'slides/';      // folder gambar (sejajar dengan index.html)
  const PREFIX = 'slide-';       // awalan nama file, contoh: slide-01.png
  // Skrip akan mencoba kombinasi ini secara otomatis:
  const EXTS = ['png','jpg','jpeg','webp'];
  const PADS = n => [String(n).padStart(2,'0'), String(n)];   // 01 dan 1

  const main = document.getElementById('scroller');
  for (let n = 1; n <= TOTAL; n++) {
    const sec = document.createElement('section');
    sec.className = 'slide';
    sec.id = 's' + n;
    sec.innerHTML = '<div class="ph"><div class="no">' + String(n).padStart(2,'0') + '</div><h2>Slide ' + n + '</h2><p>Gambar tidak ditemukan</p></div>';
    main.appendChild(sec);

    const tries = [];
    PADS(n).forEach(p => EXTS.forEach(e => tries.push(FOLDER + PREFIX + p + '.' + e)));
    (function tryNext(i){
      if (i >= tries.length) { console.warn('Slide ' + n + ' tidak ketemu. Dicoba:', tries); return; }
      const img = new Image();
      img.className = 'page';
      img.alt = 'Slide ' + n;
      img.onload  = () => { sec.querySelector('.ph').remove(); sec.appendChild(img); };
      img.onerror = () => tryNext(i + 1);
      img.src = tries[i];
    })(0);
  }
</script>
<script>
  // Ticker: isi teks diulang, lalu seluruh track digeser -50% untuk loop tanpa putus
  const track = document.getElementById('track');
  const unit = '<span>PORTFOLIO AHMAD FARHAN</span>'.repeat(10);
  track.innerHTML = unit + unit;

  const sc = document.getElementById('scroller');
  const slides = [...sc.querySelectorAll('.slide')];
  const count = document.getElementById('count');
  const bar = document.getElementById('bar');

  // Scroll mouse/trackpad vertikal -> geser ke samping
  sc.addEventListener('wheel', e => {
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
      e.preventDefault();
      sc.scrollBy({left: e.deltaY * 1.2, behavior: 'auto'});
    }
  }, {passive:false});

  function current(){
    const mid = sc.scrollLeft + sc.clientWidth / 2;
    let idx = 0;
    slides.forEach((s,i)=>{ if (s.offsetLeft <= mid) idx = i; });
    return idx;
  }
  function go(i){
    i = Math.max(0, Math.min(slides.length - 1, i));
    const s = slides[i];
    sc.scrollTo({left: s.offsetLeft - (sc.clientWidth - s.clientWidth)/2, behavior:'smooth'});
  }
  sc.addEventListener('scroll', () => {
    count.textContent = (current()+1) + ' / ' + slides.length;
    const max = sc.scrollWidth - sc.clientWidth;
    bar.style.width = (max ? sc.scrollLeft / max * 100 : 0) + '%';
  }, {passive:true});

  document.getElementById('prev').onclick = () => go(current() - 1);
  document.getElementById('next').onclick = () => go(current() + 1);
  addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') go(current() + 1);
    if (e.key === 'ArrowLeft')  go(current() - 1);
  });
</script>
<script>
  // ===== START + MUSIK =====
  const startEl = document.getElementById('start');
  const bgm = document.getElementById('bgm');
  const musBtn = document.getElementById('mus');
  const mtxt = document.getElementById('mtxt');
  bgm.volume = 0.5;               // 0.0 - 1.0
  let started = false, musicOn = true;

  function setMusicUI(){
    mtxt.textContent = musicOn ? 'ON' : 'OFF';
    musBtn.classList.toggle('off', !musicOn);
    musBtn.setAttribute('aria-pressed', musicOn);
  }
  function startSite(){
    if (started) return;
    started = true;
    startEl.classList.add('out');
    setTimeout(() => startEl.remove(), 800);
    bgm.play().catch(() => { musicOn = false; setMusicUI(); }); // file belum ada / diblokir
  }
  startEl.addEventListener('click', startSite);
  addEventListener('keydown', e => { if (!started) { e.preventDefault(); startSite(); } }, true);

  musBtn.addEventListener('click', () => {
    musicOn = !musicOn;
    if (musicOn) bgm.play().catch(() => { musicOn = false; setMusicUI(); });
    else bgm.pause();
    setMusicUI();
  });
  setMusicUI();
  document.addEventListener('visibilitychange', () => {
    if (!started) return;
    if (document.hidden) bgm.pause();
    else if (musicOn) bgm.play().catch(() => {});
  });
</script>
</body>
</html>
